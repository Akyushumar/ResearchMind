[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchmind"
version = "0.1.0"
description = "AI-powered regulatory intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "qdrant-client>=1.9.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "openai>=3.10.0",
    "google-genai>=2.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
researchmind = "researchmind.api.app:create_app"

[tool.hatch.build.targets.wheel]
packages = ["src/researchmind"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
